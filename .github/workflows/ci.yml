name: CI

# 每次 push / PR 都跑一遍：类型 → 风格 → 前端单测 → 内核自检 → 构建。
#
# 两个刻意的选择：
#   1. **不下载 Electron 二进制**（ELECTRON_SKIP_BINARY_DOWNLOAD）—— CI 只跑 Node 侧的东西
#      （类型检查、前端单测、内核自检、前端构建），不需要那个 100MB 的运行时。
#   2. **不跑 `npm run package`** —— 打便携版 exe 要 Windows + 几分钟，属于 Release 的事，
#      不放在每次 push 的路径上。
#
# 注意：node-pty 要现场编译（Linux runner 自带 g++/make/python），所以 `npm ci` 会慢一点。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（tsc --noEmit，零容忍）
        run: npx tsc --noEmit

      - name: 代码风格（eslint）
        run: npx eslint src --ext .ts,.tsx

      - name: 格式检查（prettier）
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: 前端单元测试
        run: npm run test:unit

      - name: 内核自检（1500+ 项，不联网）
        run: node scripts/selftest.mjs

      - name: 构建渲染层
        run: npm run build
