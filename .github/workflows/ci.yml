name: CI

# 每次 push / PR 都跑一遍。**只跑 `npm run verify`** —— 步骤清单的唯一真相源是
# `package.json` 里那条 verify 链，CI **不再自己抄一份**。
#
# 为什么这么改（2026-10-09）：以前 CI 各写一份 10 步清单，靠人记得和本地对齐 ——
# 真漂过一次（CI 有 prettier、本地没有），CI 从 v1.11.0 起**连红 15 次**、前 13 次
# 没人发现。现在结构上漂不了：CI 跑的就是 `npm run verify`（pre-push 钩子、preflight
# 用的也是同一条命令）。
#
# 两个刻意的选择（不变）：
#   1. **不下载 Electron 二进制**（ELECTRON_SKIP_BINARY_DOWNLOAD）—— verify 链只碰 Node 侧
#      （类型检查、前端单测、内核自检、前端构建），不需要那个 100MB 的运行时。
#   2. **不跑 `npm run package`** —— 打便携版 exe 要 Windows + 几分钟，属于 Release 的事，
#      不放在每次 push 的路径上。
#
# 注意：node-pty 要现场编译（Linux runner 自带 g++/make/python），所以 `npm ci` 会慢一点。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ★ 不能低于 22.19：依赖里有几个包写的是 "^22.13.0 || >=24.0.0"。
          #   配成 20 的时候 jsdom 的 undici 会直接崩（webidl.util.markAsUncloneable
          #   is not a function），前端单元测试从第一天就没绿过。
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 全链：typecheck → lint(src) → lint:kernel(electron 的 no-undef) → 格式 →
      #      行数红线 → check-rules → check-rules 自测 → 前端单测 → 内核自检 → 构建。
      # 与本地 `npm run verify`、pre-push 钩子**同一条命令**（唯一真相源 = package.json 里那条链）。
      - name: verify 全链（与本地 npm run verify 同一条）
        run: npm run verify
